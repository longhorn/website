{{ $src     := .Get "src" | relURL }}
{{ $caption := .Get "caption" }}
{{ $width   := .Get "width" }}
<figure class="figure">
  <a href="{{ $src }}" target="_blank">
    <img src="{{ $src }}" {{ with $width }}width="{{ . }}" style="max-width: 100%; height: auto;"{{ end }}>
  </a> 

  {{ with $caption }}
  <figcaption>
    {{ . | markdownify }}
  </figcaption>
  {{ end }}
</figure>
